name: Manter Streamlit Ativo

on:
  schedule:
    # Roda a cada 2 horas para garantir
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências
        run: |
          pip install selenium webdriver-manager

      - name: Executar Ping de Navegador Real
        run: |
          python -c "
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          import time

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          # Disfarça o robô simulando um Chrome normal em tela cheia
          options.add_argument('user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36')
          options.add_argument('--window-size=1920,1080')

          driver = webdriver.Chrome(options=options)
          url = 'https://elabore-app-kus2ne4a6stuk9npsnhyjf.streamlit.app/'
          
          print(f'Acessando {url}...')
          driver.get(url)
          
          # Espera 15 segundos para carregar os scripts e o WebSocket
          time.sleep(15)

          # Tenta encontrar e clicar em qualquer botão de acorda (múltiplos seletores)
          try:
              # Procura botões com texto de 'Wake up', 'Get this app back up', 'Yes'
              buttons = driver.find_elements(By.TAG_NAME, 'button')
              clicked = False
              for btn in buttons:
                  text = btn.text.lower()
                  if 'yes' in text or 'wake' in text or 'get this app' in text:
                      btn.click()
                      print(f'Clique efetuado no botão: {btn.text}')
                      clicked = True
                      time.sleep(20) # Aguarda o app reiniciar após o clique
                      break
              if not clicked:
                  print('Nenhum botão de wake-up encontrado. App provavelmente já estava ativo!')
          except Exception as e:
              print(f'Erro ao procurar botão: {e}')

          print('Sessão finalizada com sucesso.')
          driver.quit()
          "
