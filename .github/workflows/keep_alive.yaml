name: Manter Streamlit Ativo

on:
  schedule:
    # Roda a cada 2 horas
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências
        run: |
          pip install selenium webdriver-manager

      - name: Executar Ping de Navegador Real
        run: |
          python -c "
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          import time

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36')
          options.add_argument('--window-size=1920,1080')

          driver = webdriver.Chrome(options=options)
          url = 'https://elabore-app-kus2ne4a6stuk9npsnhyjf.streamlit.app/'
          
          print(f'Acessando {url}...')
          driver.get(url)
          
          # Aguarda o carregamento inicial da página
          time.sleep(12)

          try:
              # Busca botões dinamicamente para evitar elementos antigos (stale)
              buttons = driver.find_elements(By.TAG_NAME, 'button')
              clicked = False
              
              for i in range(len(buttons)):
                  try:
                      # Re-localiza os botões a cada iteração para não dar StaleElement
                      btn = driver.find_elements(By.TAG_NAME, 'button')[i]
                      text = btn.text.lower()
                      if 'yes' in text or 'wake' in text or 'get this app' in text:
                          driver.execute_script('arguments[0].click();', btn)
                          print(f'Sucesso! Clique efetuado no botão: {btn.text}')
                          clicked = True
                          time.sleep(20) # Tempo para o Streamlit acordar
                          break
                  except Exception:
                      continue
                      
              if not clicked:
                  print('Nenhum botão de wake-up pendente. App já está ativo!')

          except Exception as e:
              print(f'Erro durante a verificação: {e}')

          print('Sessão finalizada com sucesso.')
          driver.quit()
          "
