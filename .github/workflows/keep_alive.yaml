name: Manter Streamlit Ativo

on:
  schedule:
    # Roda a cada 2 horas
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências
        run: |
          pip install selenium webdriver-manager

      - name: Executar Ping de Navegador Real
        run: |
          python -c "
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          import time

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36')
          options.add_argument('--window-size=1920,1080')

          driver = webdriver.Chrome(options=options)
          url = 'https://elabore-app-kus2ne4a6stuk9npsnhyjf.streamlit.app/'
          
          print(f'Acessando {url}...')
          driver.get(url)
          
          # Espera a página resolver redirecionamentos do Streamlit Cloud
          time.sleep(15)

          current_url = driver.current_url
          print(f'URL Atual após carregamento: {current_url}')

          try:
              # Se o app estiver dormindo, o Streamlit mostra botões de 'Wake up' ou 'Yes, get this app back up!'
              buttons = driver.find_elements(By.TAG_NAME, 'button')
              wake_button_found = False

              for btn in buttons:
                  try:
                      text = btn.text.lower()
                      if any(k in text for k in ['yes', 'wake', 'get this app', 'acordar']):
                          print(f'Botão de acorda detectado: \"{btn.text}\". Clicando...')
                          driver.execute_script('arguments[0].click();', btn)
                          wake_button_found = True
                          time.sleep(25) # Aguarda o Streamlit iniciar a máquina do app
                          break
                  except Exception:
                      continue

              if not wake_button_found:
                  # Tenta procurar por links ou elementos específicos da tela de repouso
                  if 'share.streamlit.app' in current_url or 'sleeping' in driver.page_source.lower():
                      print('Aviso: O app parece estar em tela de repouso/redirecionamento.')
                  else:
                      print('App acessado e carregado diretamente com sucesso!')

          except Exception as e:
              print(f'Erro durante a execução: {e}')

          print('Sessão finalizada com sucesso.')
          driver.quit()
          "
